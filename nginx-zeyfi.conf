server {
    listen 80;
    server_name zeyfi.cloud www.zeyfi.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zeyfi.cloud www.zeyfi.cloud;

    ssl_certificate /root/.acme.sh/zeyfi.cloud_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/zeyfi.cloud_ecc/zeyfi.cloud.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;

    root /opt/crmzeyfi-ts/apps/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/plain image/svg+xml;
    gzip_min_length 256;

    location /.well-known/acme-challenge/ {
        root /opt/crmzeyfi-ts/apps/web/dist;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
}